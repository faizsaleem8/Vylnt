name: VYNLT checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install-deps chromium
      - run: npm run setup:browser
      - run: npm run lab:tls
      - name: Extension, API, dashboard and security gate regression
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vynlt-browser-results
          path: test-results/
          retention-days: 7
