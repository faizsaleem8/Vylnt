name: VYNLT checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install-deps chromium
      - run: npm run setup:browser
      - run: npm run lab:tls
      - name: Fresh-commit security gate and real pre-push regression
        run: npm run test:gate
      - name: PDF rendering and overload regression
        run: npm run test:pdf
      - name: Dynamic-page collection budget regression
        run: npm run benchmark:observer
        env:
          VYNLT_OBSERVER_BENCH_RUNS: 1
      - name: Extension, API, dashboard and security gate regression
        run: npm run test:browser
      - name: Dashboard and side-panel accessibility regression
        run: npm run test:ui
      - name: Scanner cache, browser restart and full-extension stress regression
        run: npm run test:scanner
      - name: Supabase sign-in and in-memory session regression
        run: npm run test:auth-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vynlt-browser-results
          path: test-results/
          retention-days: 7
