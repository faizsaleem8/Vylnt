name: VYLNT application security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security-gate:
    name: VYLNT security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run build
      - run: npx playwright install-deps chromium
      - run: npm run setup:browser
      - name: Fresh security scan of this commit
        run: npm run gate -- --commit "$GITHUB_SHA" --output reports/gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vylnt-security-gate-${{ github.sha }}
          path: reports/gate/
          retention-days: 7
          if-no-files-found: warn
