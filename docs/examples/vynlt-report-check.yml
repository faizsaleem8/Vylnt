# Copy to your WEBSITE repository as .github/workflows/vynlt.yml.
# Put a VYNLT Export JSON or Download insights JSON file at vynlt-report.json.
# DEMO ONLY: self-contained JSON hashes are not signatures or blockchain proofs.
# This checks reported observations, not whether they describe the current commit.
name: VYNLT uploaded report check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  report-check:
    name: VYNLT security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: faizsaleem8/Vylnt
          ref: c1d3ba308a6a85d964b27e270d8382d0b1ffc527
          path: vynlt-tool
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --include=optional --ignore-scripts --no-audit --no-fund
        working-directory: vynlt-tool
      - name: Prepare shared VYNLT report rules
        working-directory: vynlt-tool
        run: |
          node --input-type=module <<'JS'
          import { build } from 'esbuild';
          await build({ stdin: { contents: "export { parseSubmission } from './packages/core/validation'; export { evaluateGate } from './packages/core/gate'; export { canonicalJson, contentHash } from './packages/core/integrity'; export { RULESET_VERSION } from './packages/core';", resolveDir: process.cwd(), loader: 'ts' }, outfile: '.local/report-library.mjs', bundle: true, platform: 'node', format: 'esm', packages: 'external' });
          JS
      - name: Read exported report and evaluate its findings
        working-directory: vynlt-tool
        env:
          REPORT_FILE: ../website/vynlt-report.json
          RESULT_FILE: ../website/vynlt-report-result.json
        run: |
          node --input-type=module <<'JS'
          import { lstat, readFile, writeFile } from 'node:fs/promises';
          import { parseSubmission, evaluateGate, canonicalJson, contentHash, RULESET_VERSION } from './.local/report-library.mjs';
          const limitation = 'Demo report check only: no trusted source signature, live blockchain verification, website/commit binding or freshness verification. A pass describes the uploaded observations only.';
          // Static reasons only: never print uploaded JSON or validation values.
          const reasons = {
            REPORT_NOT_FOUND: 'vynlt-report.json was not found at the website repository root. Commit and push that exact filename.',
            INVALID_FILE: 'vynlt-report.json must be a regular file smaller than 4 MiB, not a symbolic link.',
            INVALID_JSON: 'vynlt-report.json is not valid JSON. Download Export JSON or Download insights JSON from VYNLT; do not rename a PDF.',
            INVALID_FORMAT: 'The JSON is not a raw VYNLT scan or a supported frozen insights export.',
            INVALID_HASH: 'The frozen insights content or original scan does not match its included hash. Download the report again without editing it.',
            RULESET_MISMATCH: 'The report ruleset is incompatible with the pinned VYNLT tool revision.',
            INCOMPLETE_HEADERS: 'Response headers were not collected. Enable header collection, rescan and export a new report.',
            INCOMPLETE_DOM: 'DOM collection is incomplete. Rescan a supported page after granting the extension access.',
            INCOMPLETE_COOKIES: 'Cookies were not collected. Enable cookie collection, rescan and export a new report.',
            INVALID_OBSERVATION: 'The scan ID or observation fields do not match the pinned VYNLT schema. Export the original report without editing it.',
            FINDINGS_MISMATCH: 'Saved findings differ from findings recomputed by the pinned VYNLT rules. The report may have been edited or generated by different detection code.',
            SCORE_MISMATCH: 'The saved score differs from the score recomputed by the pinned VYNLT rules.',
            METADATA_MISMATCH: 'Report metadata or normalized observations differ from the pinned VYNLT report format.',
            CHECK_ERROR: 'The report check could not complete. Check the setup steps and download a fresh VYNLT JSON export.'
          };
          const fail = code => { const error = new Error(code); error.reportCheckCode = code; throw error; };
          let result;
          try {
            const info = await lstat(process.env.REPORT_FILE);
            if (!info.isFile() || info.isSymbolicLink() || info.size > 4 * 1024 * 1024) fail('INVALID_FILE');
            let uploaded;
            try { uploaded = JSON.parse(await readFile(process.env.REPORT_FILE, 'utf8')); } catch (error) { if (error instanceof SyntaxError) fail('INVALID_JSON'); throw error; }
            if (!uploaded || typeof uploaded !== 'object' || Array.isArray(uploaded)) fail('INVALID_FORMAT');
            let raw = uploaded;
            let format = 'raw';
            if (uploaded?.content) {
              format = 'frozen-insights';
              if (uploaded.content.version !== 'vynlt-frozen-insights-v1' || !uploaded.content.originalScan) fail('INVALID_FORMAT');
              if (uploaded.id !== uploaded.hash || !/^[a-f0-9]{64}$/.test(uploaded.hash) || await contentHash(uploaded.content) !== uploaded.hash || await contentHash(uploaded.content.originalScan) !== uploaded.content.originalScanHash) fail('INVALID_HASH');
              raw = uploaded.content.originalScan;
            }
            if (!raw || typeof raw !== 'object' || !raw.observation || typeof raw.observation !== 'object') fail('INVALID_FORMAT');
            if (raw.rulesetVersion !== RULESET_VERSION) fail('RULESET_MISMATCH');
            if (raw.observation.headers === undefined) fail('INCOMPLETE_HEADERS');
            if (raw.observation.domCollected !== true) fail('INCOMPLETE_DOM');
            if (raw.observation.cookies === undefined) fail('INCOMPLETE_COOKIES');
            // Recompute using shared detection rules. Edited findings/severity cannot
            // override the uploaded observations. Observations themselves are untrusted.
            let report;
            try { report = parseSubmission({ scanId: raw.scanId, observation: raw.observation }); } catch { fail('INVALID_OBSERVATION'); }
            if (canonicalJson(report.findings) !== canonicalJson(raw.findings ?? null)) fail('FINDINGS_MISMATCH');
            if (report.score !== raw.score) fail('SCORE_MISMATCH');
            if (canonicalJson(report) !== canonicalJson(raw)) fail('METADATA_MISMATCH');
            const decision = evaluateGate(report);
            result = { mode: 'uploaded-report-demo', status: decision.blocking.length ? 'blocked' : 'passed', format, policy: decision.policy, reportHash: await contentHash(raw), checkedCommit: process.env.GITHUB_SHA ?? null, commitBound: false, limitation, blocking: decision.blocking.map(f => ({ rule: f.ruleId, severity: f.severity, confidence: f.confidence, title: f.title, fix: f.recommendation })), warnings: decision.warnings.map(f => ({ rule: f.ruleId, severity: f.severity, confidence: f.confidence, title: f.title, fix: f.recommendation })) };
            process.exitCode = result.status === 'blocked' ? 1 : 0;
          } catch (error) {
            const code = error?.code === 'ENOENT' ? 'REPORT_NOT_FOUND' : Object.hasOwn(reasons, error?.reportCheckCode ?? '') ? error.reportCheckCode : 'CHECK_ERROR';
            result = { mode: 'uploaded-report-demo', status: 'error', commitBound: false, limitation, errorCode: code, error: reasons[code] };
            process.exitCode = 2;
          }
          await writeFile(process.env.RESULT_FILE, JSON.stringify(result, null, 2));
          console.log(`VYNLT uploaded report: ${result.status.toUpperCase()}`);
          if (result.error) console.log(`Reason: ${result.errorCode} — ${result.error}`);
          console.log(limitation);
          const rows = [`# VYNLT uploaded report: ${result.status.toUpperCase()}`, '', limitation, '', result.error ?? `${result.blocking.length} blocking findings; ${result.warnings.length} warnings.`, ''];
          const escape = value => String(value).replace(/[&<>"'`|\[\]()*_!\\]/g, ch => `&#${ch.charCodeAt(0)};`).replace(/[\r\n]/g, ' ');
          for (const [kind, findings] of [['BLOCK', result.blocking ?? []], ['WARN', result.warnings ?? []]]) {
            for (const finding of findings) {
              console.log(`${kind} ${finding.rule}: ${finding.title} — ${finding.fix}`);
              rows.push(`- **${kind} ${escape(finding.rule)}** ${escape(finding.title)} (${escape(finding.severity)}/${escape(finding.confidence)}). Fix: ${escape(finding.fix)}`);
            }
          }
          if (process.env.GITHUB_STEP_SUMMARY) await writeFile(process.env.GITHUB_STEP_SUMMARY, rows.join('\n') + '\n', { flag: 'a' });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vynlt-uploaded-report-result
          path: website/vynlt-report-result.json
          retention-days: 7
